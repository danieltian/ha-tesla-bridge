name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements_test.txt
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Integration tests
        run: .venv/bin/python -m pytest tests/integration -q
      - name: App tests
        run: .venv/bin/python -m pytest tests/app -q -p no:homeassistant
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Cross-check JWS signing against Tesla's tesla-jws
        run: |
          git clone --depth 1 https://github.com/teslamotors/vehicle-command.git /tmp/vehicle-command
          (cd /tmp/vehicle-command && go build -o /tmp/tesla-jws ./cmd/tesla-jws)
          TESLA_JWS_BIN=/tmp/tesla-jws .venv/bin/python -m pytest tests/jws -q -p no:homeassistant

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build app image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: apps/tesla_bridge
          platforms: linux/amd64,linux/arm64
          push: false
