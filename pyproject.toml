[project]
name = "ha-tesla-bridge"
version = "0.3.0"
description = "Home Assistant integration and app for Tesla vehicles and Powerwall with self-hosted Fleet Telemetry streaming"
requires-python = ">=3.14"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "apps/tesla_bridge/rootfs/usr/lib"]
filterwarnings = ["ignore::DeprecationWarning:josepy.*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "C4", "PIE", "PT", "RET", "TRY"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "TRY003", "TRY400", "PT018", "ASYNC109", "E501", "RUF012", "TRY301", "PLW0108"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "custom_components", "tesla_bridge"]
combine-as-imports = true

[tool.ruff.per-file-target-version]
# The app runs on Debian trixie's Python 3.13.
"apps/**" = "py313"
